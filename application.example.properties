# Konfigurationsbeispiel für den Flood Monitor (ohne geheime Zugangsdaten)
#
# Verwendung: Datei z. B. als application.properties neben das JAR bzw. ins Projektverzeichnis kopieren
# und Werte anpassen, oder einzelne Werte beim Start überschreiben:
#   gradlew.bat bootRun --args="--simulation.interval=2000"
#
# Der API-Key wird NICHT in Dateien gespeichert, sondern als Umgebungsvariable gesetzt:
#   PowerShell:  $env:FLOODMONITOR_API_KEY="<eigener-geheimer-key>"
#   Linux/macOS: export FLOODMONITOR_API_KEY=<eigener-geheimer-key>

server.port=8080

# Simulation
simulation.enabled=true
# Intervall zwischen zwei Messungen in Millisekunden
simulation.interval=10000
# Anzahl der beim Start rückwirkend erzeugten Messungen pro Station
simulation.history-size=60

# Warnstufe UNKNOWN, wenn die letzte Messung älter als N Intervalle ist
warning.stale-after-intervals=3

# API-Key für POST/DELETE (Header X-API-Key) – Wert kommt aus der Umgebungsvariable
api.key=${FLOODMONITOR_API_KEY}

# Keine Stacktraces an Clients
server.error.include-stacktrace=never
server.error.include-message=never

spring.jackson.serialization.write-dates-as-timestamps=false
