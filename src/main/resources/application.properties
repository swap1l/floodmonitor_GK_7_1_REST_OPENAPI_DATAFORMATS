server.port=8080

# Simulation
# Intervall zwischen zwei Messungen in Millisekunden
simulation.interval=10000
# Simulation ein-/ausschalten (in Tests deaktiviert)
simulation.enabled=true
# Anzahl der beim Start rückwirkend erzeugten Messungen pro Station
simulation.history-size=60

# Eine Messung gilt als veraltet (-> UNKNOWN), wenn sie älter als diese Anzahl Intervalle ist
warning.stale-after-intervals=3

spring.jackson.serialization.write-dates-as-timestamps=false

# Sicherheit
# API-Key für schreibende Zugriffe (POST/DELETE), Header X-API-Key.
# Echten Key NICHT hier eintragen, sondern über die Umgebungsvariable FLOODMONITOR_API_KEY setzen.
# Der Standardwert ist nur für die lokale Entwicklung gedacht.
api.key=${FLOODMONITOR_API_KEY:dev-key-change-me}
# Niemals Stacktraces oder Exception-Details an Clients ausliefern
server.error.include-stacktrace=never
server.error.include-message=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.paths-to-exclude=/api/**/xml
